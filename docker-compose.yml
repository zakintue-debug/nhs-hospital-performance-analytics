services:
  postgres:
    image: postgres:16
    container_name: nhs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - nhs_postgres_data:/var/lib/postgresql/data
      - ./data/processed:/data/processed:ro
      - ./sql:/sql:ro

volumes:
  nhs_postgres_data:
